<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>F4F Checker</title>
  <link rel="stylesheet" href="popup.css">
  <script src="theme.js" defer></script>
  <script src="popup.js" defer></script>
</head>
<body>
  <header>
    <div class="brand-mark" aria-hidden="true">
      <img class="logo-light" src="icons/logo-light-128.png" width="44" height="44" alt="">
      <img class="logo-dark" src="icons/icon-128.png" width="44" height="44" alt="">
    </div>
    <div><h1>F4F Checker</h1><p>Your follow-back check</p></div>
  </header>
  <main>
    <section class="status-panel" aria-live="polite" aria-atomic="true">
      <div id="indicator" class="indicator idle" aria-hidden="true"><span id="symbol">↗</span></div>
      <h2 id="title">Ready to check?</h2>
      <p id="message">See which accounts you follow don’t follow you back.</p>
    </section>
    <p id="reminder" class="reminder">Instagram will open in an active tab. Keep it active while checking.</p>
    <p id="result-summary" class="result-summary" hidden></p>
    <div class="actions">
      <button id="start" class="primary">Start Checking <span aria-hidden="true">→</span></button>
      <button id="view" class="primary" hidden>View Results <span aria-hidden="true">↗</span></button>
      <button id="continue" class="primary" hidden>Return to Instagram</button>
      <button id="again" class="secondary" hidden>Check Again</button>
    </div>
    <p id="action-error" role="alert" hidden></p>
  </main>
  <footer>
    <div class="appearance"><label for="appearance">Appearance</label><select id="appearance">
      <option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option>
    </select></div>
    <p id="appearance-error" role="alert" hidden></p>
    <p class="author">By Emil Valiyev</p>
  </footer>
</body>
</html>
